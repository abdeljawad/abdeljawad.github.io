<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3; url=index.html">
  <title>Page not found | Ahmed Abdeljawad</title>
  <meta name="description" content="Page not found.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    (() => {
      const valid = value => value === "light" || value === "dark";
      let theme = null;

      try {
        const urlTheme = new URLSearchParams(window.location.search).get("theme");
        if (valid(urlTheme)) theme = urlTheme;
      } catch (_) {}

      if (!theme) {
        try {
          const savedTheme = localStorage.getItem("theme");
          if (valid(savedTheme)) theme = savedTheme;
        } catch (_) {}
      }

      if (!theme && window.location.protocol !== "file:") {
        const match = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
        if (match) theme = match[1];
      }

      if (!theme) {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script defer src="assets/js/site.js"></script>
</head>
<body>
  <main class="container page-content simple-page">
    <h1>Page not found</h1>
    <p>Looks like there has been a mistake. Nothing exists here.</p>
    <p>You will be redirected to the main page within 3 seconds. If not redirected, please click <a href="index.html">here</a>.</p>
  </main>
</body>
</html>
